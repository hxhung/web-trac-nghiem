<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung chưa sẵn sàng - Ngân Hàng Đề Thi Toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Thiết lập nền và font chữ giống trang chủ */
        body { 
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; /* Chiều cao full màn hình */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Card thông báo ở giữa */
        .error-card {
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 50px 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
        }

        /* Vòng tròn chứa icon */
        .icon-circle {
            width: 120px;
            height: 120px;
            background: #e7f1ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: #0d6efd;
            font-size: 4rem;
            /* Hiệu ứng bay nhẹ */
            animation: float 3s ease-in-out infinite;
        }

        /* Định nghĩa hiệu ứng bay */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Tiêu đề */
        .error-title {
            font-weight: 800;
            color: #212529;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #0d6efd 0%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mô tả */
        .error-desc {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Nút quay lại (giống nút btn-start ở trang chủ) */
        .btn-back {
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: 600;
            background: linear-gradient(90deg, #0d6efd, #0099ff);
            border: none;
            color: white;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(13, 110, 253, 0.4);
            color: white;
            background: linear-gradient(90deg, #0b5ed7, #0088cc);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-card mx-auto">
            <div class="icon-circle">
                <i class="fas fa-hammer"></i>
            </div>
            
            <h2 class="display-6 error-title">ĐANG BIÊN SOẠN</h2>
            <p class="error-desc">
                Hiện tại đề thi này chưa được cập nhật lên hệ thống. 
                <br>Thầy cô và các em vui lòng quay lại sau nhé!
            </p>

            <a href="index.html" class="btn btn-back">
                <i class="fas fa-arrow-left me-2"></i> Quay lại trang chủ
            </a>
        </div>
        
        <div class="text-center mt-4 text-muted small opacity-75">
            &copy; 2024 Ngân Hàng Đề Thi Toán CT2018
        </div>
    </div>

</body>
</html>
