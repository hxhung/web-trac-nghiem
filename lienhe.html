<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - Hệ Thống Trắc Nghiệm Toán</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',Arial,sans-serif;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh;
            padding:20px;
            line-height:1.6
        }
        .container{
            max-width:1000px;margin:0 auto;background:#fff;
            border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
            overflow:hidden
        }
        .header{
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:#fff;padding:40px 30px;text-align:center;position:relative
        }
        .header h1{font-size:2.5em;margin-bottom:10px}
        .content{padding:40px 30px}
        .section{margin-bottom:40px}
        .section-title{
            display:flex;align-items:center;gap:15px;
            margin-bottom:20px;border-bottom:3px solid #667eea
        }
        .section-number{
            width:45px;height:45px;border-radius:50%;
            background:#667eea;color:#fff;
            display:flex;align-items:center;justify-content:center;
            font-weight:bold
        }
        .form-box{
            background:#f8f9ff;border-radius:15px;
            padding:30px;box-shadow:0 4px 15px rgba(102,126,234,.1)
        }
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-weight:600;margin-bottom:8px}
        .form-group input,
        .form-group textarea,
        .form-group select{
            width:100%;padding:12px;border:2px solid #e0e0e0;
            border-radius:8px;font-size:1em
        }
        .btn-submit{
            width:100%;padding:15px;border:none;
            border-radius:30px;font-size:1.1em;
            font-weight:bold;cursor:pointer;color:#fff;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)
        }
        .footer{
            text-align:center;padding:20px;
            background:#f8f9fa;color:#666
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>📧 LIÊN HỆ VỚI CHÚNG TÔI</h1>
        <p>Hệ thống Trắc nghiệm Toán Online – CTGDPT 2018</p>
    </div>

    <div class="content">

        <section class="section">
            <div class="section-title">
                <div class="section-number">📝</div>
                <h2>Gửi Tin Nhắn</h2>
            </div>

            <div class="form-box">
                <form id="contactForm">

                    <div class="form-group">
                        <label>Họ và tên *</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="phone">
                    </div>

                    <div class="form-group">
                        <label>Chủ đề *</label>
                        <select id="subject" required>
                            <option value="">-- Chọn chủ đề --</option>
                            <option value="Câu hỏi đề thi">Câu hỏi về đề thi</option>
                            <option value="Hỗ trợ kỹ thuật">Hỗ trợ kỹ thuật</option>
                            <option value="Góp ý">Góp ý / Phản hồi</option>
                            <option value="Hợp tác">Hợp tác</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nội dung *</label>
                        <textarea id="message" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">📤 Gửi tin nhắn</button>
                </form>
            </div>
        </section>

        <div style="text-align:center;margin-top:30px">
            <a href="index.html">← Quay về trang chủ</a>
        </div>

    </div>

    <div class="footer">
        © 2026 – Hệ thống Trắc nghiệm Toán – hxhung
    </div>

</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwhr2Forf8aDwyqzLb55n9lUMD2DlPO_x1s7b_bqE7e90qRJXRL0qsgjXRa0Db6GeVD/exec';
const form = document.querySelector('form'); // Hoặc id của form nếu có

form.addEventListener('submit', e => {
  e.preventDefault();
  
  // Thu thập dữ liệu từ các ô input
  const data = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };

  // Sử dụng fetch với cấu hình để tránh lỗi CORS của Google
  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors', // Rất quan trọng để gửi được đến Google Script
    cache: 'no-cache',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(data)
  })
  .then(() => {
    alert("Cảm ơn bạn! Thông tin đã được gửi đi thành công.");
    form.reset();
  })
  .catch(error => {
    console.error('Lỗi!', error.message);
    alert("Có lỗi xảy ra, vui lòng thử lại.");
  });
});
</script>

</body>
</html>
