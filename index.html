<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng Đề Thi Toán CT2018</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .hero-section { background: linear-gradient(135deg, #0d6efd 0%, #0099ff 100%); color: white; padding: 50px 0 80px; margin-bottom: -40px; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px rgba(13, 110, 253, 0.2); }
        .search-box { max-width: 500px; margin: 20px auto 0; position: relative; }
        .search-box input { border-radius: 50px; padding: 15px 25px; padding-right: 50px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-size: 1rem; }
        .search-box i { position: absolute; right: 25px; top: 50%; transform: translateY(-50%); color: #0d6efd; font-size: 1.2rem; }
        .test-card { border: none; border-radius: 20px; background: white; transition: all 0.3s ease; height: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; }
        .test-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .card-icon { font-size: 2.5rem; margin-bottom: 20px; color: #0d6efd; background: #e7f1ff; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: transform 0.3s; }
        .test-card:hover .card-icon { transform: rotate(15deg) scale(1.1); background: #0d6efd; color: white; }
        .btn-start { width: 100%; border-radius: 50px; font-weight: 600; padding: 12px; background: linear-gradient(90deg, #0d6efd, #0099ff); border: none; }
        .btn-start:hover { background: linear-gradient(90deg, #0b5ed7, #0088cc); }
        .meta-info { font-size: 0.9rem; color: #6c757d; background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <div class="container">
            <h1 class="fw-bold display-5"><i class="fas fa-graduation-cap me-2"></i>KHO ĐỀ THI TOÁN</h1>
            <p class="lead opacity-75">Chương trình GDPT 2018 - Chấm điểm tự động</p>
            <div class="search-box">
                <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên bài thi hoặc chủ đề..." onkeyup="filterTests()">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </div>

    <div class="container pb-5 flex-grow-1">
        <div class="row g-4 justify-content-center" id="testList">

            <div class="col-md-4 col-sm-6 test-item">
                <div class="card test-card p-4">
                    <div class="card-body text-center">
                        <div class="mx-auto card-icon"><i class="fas fa-book-open"></i></div>
                        <h5 class="card-title fw-bold text-uppercase text-primary mb-1">ĐỀ MẪU</h5>
                        <p class="card-text fw-bold mb-3">Ví dụ minh họa</p>
                        <div class="d-flex justify-content-between meta-info">
                            <span><i class="fas fa-clock text-warning"></i> 45'</span>
                            <span><i class="fas fa-layer-group text-success"></i> 3 Phần</span>
                        </div>
                        <a href="#" class="btn btn-primary btn-start shadow-sm" onclick="alert('Đây là đề mẫu!'); return false;">
                            Vào thi ngay <i class="fas fa-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>

  <div class="col-md-4 col-sm-6 test-item">
    <div class="card test-card p-4 h-100 shadow-sm border-0">
        <div class="card-body text-center">
            <div class="mx-auto card-icon mb-3" style="width:60px;height:60px;background:#eef2f7;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#4e73df;font-size:24px;">
                <i class="fas fa-chart-line"></i>
            </div>
            <h5 class="card-title fw-bold text-uppercase text-dark mb-2">ĐỀ SỐ 01</h5>
            <p class="card-text text-muted mb-3">Chương 1: Ứng dụng đạo hàm</p>
            <div class="d-flex justify-content-between meta-info small text-secondary mb-4">
                <span><i class="fas fa-question-circle me-1"></i> 22 Câu</span>
                <span><i class="far fa-clock me-1"></i> 90 Phút</span>
            </div>
            <a href="de-01.html" class="btn btn-primary w-100 rounded-pill fw-bold">
                Vào thi ngay <i class="fas fa-arrow-right ms-2"></i>
            </a>
        </div>
    </div>
</div>

            
            </div>
    </div>

    <footer class="text-center py-4 text-muted mt-auto border-top bg-white">
        <small>© 2024 Hệ thống Trắc nghiệm Toán - Xây dựng với NotebookLM & GitHub Pages</small>
    </footer>

    <script>
        function filterTests() {
            var input = document.getElementById("searchInput");
            var filter = input.value.toUpperCase();
            var list = document.getElementById("testList");
            var items = list.getElementsByClassName("test-item");
            for (var i = 0; i < items.length; i++) {
                var title = items[i].querySelector(".card-title").innerText;
                var text = items[i].querySelector(".card-text").innerText;
                if (title.toUpperCase().indexOf(filter) > -1 || text.toUpperCase().indexOf(filter) > -1) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
