<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Hệ thống Trắc nghiệm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --text-color: #333;
            --bg-color: #f4f7f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            line-height: 1.6;
            color: var(--text-color);
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        /* CSS Tinh chỉnh: Thông báo thành công */
        #status-message {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px;
            background-color: #2ecc71;
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            min-width: 300px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); }
            to { transform: translateX(0); }
        }

        .countdown-circle {
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="contact-card">
            <h1><i class="fas fa-paper-plane"></i> Gửi tin nhắn cho chúng tôi</h1>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" name="name" placeholder="Nhập họ tên của bạn" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <input type="text" id="subject" name="subject" placeholder="Bạn cần hỗ trợ về việc gì?">
                </div>

                <div class="form-group">
                    <label for="message">Nội dung</label>
                    <textarea id="message" name="message" placeholder="Viết tin nhắn của bạn tại đây..." required></textarea>
                </div>

                <button type="submit" id="submitBtn">Gửi tin nhắn ngay</button>
            </form>
        </div>
    </div>

    <div id="status-message">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-check-circle fa-2x"></i>
            <div>
                <strong>Gửi thành công!</strong><br>
                Cảm ơn bạn đã liên hệ.<br>
                Tự động về trang chủ trong <span id="countdown" class="countdown-circle">5</span>s
            </div>
        </div>
    </div>

    <script>
        // QUAN TRỌNG: Dán URL Web App của bạn vào đây
     const scriptURL = 'https://script.google.com/macros/s/AKfycbwhr2Forf8aDwyqzLb55n9lUMD2DlPO_x1s7b_bqE7e90qRJXRL0qsgjXRa0Db6GeVD/exec';

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-message');
        const countdownElem = document.getElementById('countdown');

        form.addEventListener('submit', e => {
            e.preventDefault();

            // Hiệu ứng khi đang gửi
            submitBtn.disabled = true;
            submitBtn.innerText = "Đang gửi dữ liệu...";

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                // Hiển thị thông báo thành công
                statusMsg.style.display = 'block';
                form.reset();

                // Chạy bộ đếm ngược 5 giây
                let count = 5;
                const timer = setInterval(() => {
                    count--;
                    countdownElem.innerText = count;
                    if (count <= 0) {
                        clearInterval(timer);
                        window.location.href = 'index.html'; // Quay về trang chủ
                    }
                }, 1000);
            })
            .catch(error => {
                console.error('Lỗi:', error);
                alert("Có lỗi xảy ra. Vui lòng kiểm tra kết nối!");
                submitBtn.disabled = false;
                submitBtn.innerText = "Gửi tin nhắn ngay";
            });
        });
    </script>
</body>
</html>
